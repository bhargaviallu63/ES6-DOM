<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard Pro</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    margin: 0;
    text-align: center;
  }

  .box {
    width: 60%;
    margin: auto;
    background: white;
    padding: 20px;
    margin-top: 30px;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
  }

  input {
    padding: 10px;
    margin: 5px;
    width: 80%;
  }

  button {
    padding: 10px;
    background: #2d89ef;
    color: white;
    border: none;
    cursor: pointer;
    margin: 5px;
  }

  table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 10px;
  }

  th {
    background: #333;
    color: white;
  }

  .delete {
    background: red;
    color: white;
    border: none;
    padding: 5px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="box">
  <h2>Student Dashboard Pro</h2>

  <input id="name" type="text" placeholder="Enter Name">
  <input id="course" type="text" placeholder="Enter Course">
  <input id="email" type="email" placeholder="Enter Email">

  <br>
  <button onclick="addStudent()">Add Student</button>

  <input id="search" type="text" placeholder="Search..." oninput="searchStudent()">

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Course</th>
        <th>Email</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

<script>
"use strict";

// Safe initialization
let students = [];

try {
  const data = localStorage.getItem("students");
  students = data ? JSON.parse(data) : [];
  if (!Array.isArray(students)) students = [];
} catch (e) {
  students = [];
}

// Save safely
const saveData = () => {
  try {
    localStorage.setItem("students", JSON.stringify(students));
  } catch (e) {
    alert("Storage error!");
  }
};

// Validate email
const isValidEmail = (email) =>
  /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

// Render function (safe DOM creation)
const render = (list = students) => {
  const table = document.getElementById("table");
  if (!table) return;

  table.innerHTML = "";

  list.forEach((s, i) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${escapeHtml(s.name)}</td>
      <td>${escapeHtml(s.course)}</td>
      <td>${escapeHtml(s.email)}</td>
      <td><button class="delete" onclick="deleteStudent(${i})">Delete</button></td>
    `;

    table.appendChild(tr);
  });
};

// Prevent HTML injection (important improvement)
const escapeHtml = (text) => {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
};

// Add student with full validation
const addStudent = () => {
  const name = document.getElementById("name")?.value.trim();
  const course = document.getElementById("course")?.value.trim();
  const email = document.getElementById("email")?.value.trim();

  if (!name || !course || !email) {
    alert("All fields required");
    return;
  }

  if (!isValidEmail(email)) {
    alert("Invalid email format");
    return;
  }

  const exists = students.some(s => s.email === email);
  if (exists) {
    alert("Student already exists");
    return;
  }

  students.push({ name, course, email });

  saveData();
  render();

  document.getElementById("name").value = "";
  document.getElementById("course").value = "";
  document.getElementById("email").value = "";
};

// Delete safely
const deleteStudent = (index) => {
  if (index < 0 || index >= students.length) return;

  students.splice(index, 1);
  saveData();
  render();
};

// Safe search (no DOM dependency issues)
const searchStudent = () => {
  const value = document.getElementById("search")?.value.toLowerCase() || "";

  const filtered = students.filter(s =>
    s.name.toLowerCase().includes(value) ||
    s.course.toLowerCase().includes(value) ||
    s.email.toLowerCase().includes(value)
  );

  render(filtered);
};

// Initial load
render();

</script>

</body>
</html>
