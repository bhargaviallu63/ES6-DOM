<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ES6 DOM Playground (Clean Version)</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        text-align: center;
        padding: 20px;
    }

    button {
        padding: 10px 18px;
        margin: 10px;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        background: #38bdf8;
        font-weight: bold;
    }

    .active {
        background: #22c55e;
        color: white;
    }

    .box {
        width: 90px;
        height: 90px;
        background: crimson;
        margin: 8px;
        display: inline-block;
    }

    .container {
        margin-top: 20px;
    }
</style>
</head>

<body>

<h1>🔥 ES6 DOM Playground (Clean)</h1>

<button id="btnToggle">Toggle Button</button>
<button id="btnHide">Hide Boxes</button>
<button id="btnLoad">Load Message</button>

<div class="container" id="wrapper">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</div>

<script type="module">

// =========================
// Q3: Destructuring event object
// =========================
const btnToggle = document.querySelector("#btnToggle");

if (btnToggle) {
    btnToggle.addEventListener("click", ({ target }) => {
        console.log("Clicked element:", target);
        target.classList.toggle("active");
    });
}

// =========================
// Q2: Spread operator (NodeList → Array)
// =========================
const btnHide = document.querySelector("#btnHide");

if (btnHide) {
    btnHide.addEventListener("click", () => {
        const divs = document.querySelectorAll(".box");
        const divArray = [...divs];

        divArray.forEach(div => {
            div.style.display = "none";
        });
    });
}

// =========================
// Q4: const DOM reference safe usage
// =========================
const container = document.getElementById("wrapper");

const btnLoad = document.querySelector("#btnLoad");

if (btnLoad && container) {
    btnLoad.addEventListener("click", () => {
        container.innerHTML = "<p>Loading Complete 🚀</p>";
    });
}

// =========================
// Q1: Arrow function vs normal function demo
// =========================
btnToggle.addEventListener("click", function () {
    console.log("Normal function this =", this);
});

// =========================
// Q5: module behavior explanation (safe simulation)
// =========================
// Script type="module" automatically runs after DOM is parsed,
// so DOM queries above are safe.

</script>

</body>
</html>
